name: App Build and Unit Tests

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Cache Derived Data
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-${{ hashFiles('**/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-xcode-
                  
      - name: Build and run tests
        run: |
          # Pick the first available iPhone simulator, regardless of model number.
          DEVICE_ID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')
      
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator found."
            exit 1
          fi
      
          DEST="platform=iOS Simulator,id=$DEVICE_ID"
      
          echo "Using destination: $DEST"
      
          xcodebuild test \
            -project "SwiftAIReferenceApp.xcodeproj" \
            -scheme "SwiftAIReferenceApp" \
            -destination "$DEST" \
            -only-testing:"SwiftAIReferenceAppTests" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""
