name: Swift/Xcode CI with project files check 

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Derived Data
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-${{ hashFiles('**/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-xcode-
                  
      - name: Build and run tests
        run: |
          # pick first available iOS Simulator
          DEVICE_ID=$(xcrun simctl list devices available | \
            grep -E "iPhone 18 Pro|iPhone 18|iPhone 17|iPhone 17 Pro|iPhone 16|iPhone 16 Pro|iPhone Air|iPhone 15|iPhone 14" | \
            grep -v "unavailable" | grep -v "Shut.*" | \
            head -n 1 | \
            awk -F '[()]' '{print $2}')
      
          if [ -z "$DEVICE_ID" ]; then
            # fallback to generic device by name
            DEST="platform=iOS Simulator,name=iPhone 16"
          else
            DEST="platform=iOS Simulator,id=$DEVICE_ID"
          fi
      
          echo "Using destination: $DEST"
      
          xcodebuild test \
            -project "SwiftAIReferenceApp.xcodeproj" \
            -scheme "SwiftAIReferenceApp" \
            -destination "$DEST" \
            -only-testing:"SwiftAIReferenceAppTests" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""
